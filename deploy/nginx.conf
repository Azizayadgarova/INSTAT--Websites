# INSTAT — nginx konfiguratsiyasi
# /etc/nginx/sites-available/instat.conf ga qo'ying va sites-enabled ga symlink qiling.
# SPA fallback SHART: usiz /about/tuzilma ga to'g'ridan-to'g'ri kirilganda 404 chiqadi.

server {
	listen 80;
	server_name instat.uz www.instat.uz;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	server_name instat.uz www.instat.uz;

	ssl_certificate     /etc/letsencrypt/live/instat.uz/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/instat.uz/privkey.pem;

	# CI symlinkni shu yerga qaratadi: /var/www/current -> /var/www/releases/<sha>
	root /var/www/current;
	index index.html;

	# Xavfsizlik sarlavhalari
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	# Siqish
	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Xeshlangan nomli assetlar — bir yillik kesh
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	# Rasmlar va shriftlar
	location ~* \.(webp|png|jpg|jpeg|svg|woff2?)$ {
		expires 30d;
		add_header Cache-Control "public";
		access_log off;
	}

	# index.html hech qachon keshlanmasin — aks holda foydalanuvchi eski build'da qoladi
	location = /index.html {
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# SPA fallback — barcha marshrutlar index.html ga
	location / {
		try_files $uri $uri/ /index.html;
	}
}
